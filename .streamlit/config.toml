[theme]
# Compact, consistent research workspace using native Streamlit theme tokens.
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FB"
textColor = "#18263D"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["2.1rem", "1.5rem", "1.15rem", "1rem", "0.9rem", "0.85rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
borderColor = "#E0E7F0"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.25rem"
paddingBottom = "2rem"
dataframeHeaderBackgroundColor = "#F3F6FB"

[theme.sidebar]
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
headingFontSizes = ["1.5rem", "1.25rem", "1.15rem", "1rem", "0.9rem", "0.85rem"]
paddingTop = "1rem"

[server]
# keep uploads generous for chunky datasets
maxUploadSize = 200
