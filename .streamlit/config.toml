[theme]
# Editorial research workspace with a quiet canvas and a contrasting sidebar.
base = "light"
primaryColor = "#2458D3"
backgroundColor = "#FCFDFF"
secondaryBackgroundColor = "#F0F4FA"
textColor = "#162640"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["3rem", "1.6rem", "1.25rem", "1rem", "0.9rem", "0.85rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
borderColor = "#DFE6EF"
baseRadius = "1rem"
buttonRadius = "0.65rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "2rem"
paddingBottom = "3rem"
dataframeHeaderBackgroundColor = "#EDF2FA"
dataframeHeaderTextColor = "#162640"
blueColor = "#2458D3"
blueTextColor = "#2458D3"

[theme.sidebar]
backgroundColor = "#142640"
secondaryBackgroundColor = "#203754"
textColor = "#EAF0FA"
primaryColor = "#73A6FF"
borderColor = "#354A65"
blueTextColor = "#BDD5FF"
blueBackgroundColor = "#264369"
headingFontSizes = ["1.5rem", "1.25rem", "1.15rem", "1rem", "0.9rem", "0.85rem"]
paddingTop = "2rem"

[server]
# keep uploads generous for chunky datasets
maxUploadSize = 200
